[project]
name = "ocpp-mitm"
version = "0.1.0"
description = "Logging man-in-the-middle proxy for OCPP-J (WebSocket) and OCPP SOAP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.10"]

[project.scripts]
ocpp-mitm = "ocpp_mitm.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
